<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<title>오늘의 가능성</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  background:#03182c;
  font-family:
    "Pretendard",
    "Noto Sans KR",
    Arial,
    sans-serif;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
}

/* ========================================
   공통 화면
======================================== */

.screen{
  position:relative;
  width:100%;
  max-width:600px;
  height:100vh;
  max-height:1067px;
  aspect-ratio:9 / 16;
  overflow:hidden;
  background:#06243c;
}

/* ========================================
   첫 시작 화면
======================================== */

.startScreen{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  background-image:
    linear-gradient(
      180deg,
      rgba(4,27,49,.18),
      rgba(3,20,39,.38)
    ),
    url("./bi.png");

  background-size:cover;
  background-position:center;

  transition:opacity .8s ease,
             transform .8s ease;
}

/* 화면 전체의 은은한 빛 */

.startScreen::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(255,255,255,.22) 0%,
      rgba(255,255,255,.10) 16%,
      rgba(255,255,255,.03) 35%,
      transparent 62%
    );

  pointer-events:none;
}

/* 아래쪽 물빛 */

.startScreen::after{
  content:"";
  position:absolute;
  left:-20%;
  bottom:-12%;
  width:140%;
  height:42%;

  background:
    radial-gradient(
      ellipse at center,
      rgba(98,220,255,.20),
      rgba(20,120,170,.08) 42%,
      transparent 72%
    );

  pointer-events:none;
}

/* ========================================
   반짝이는 빛
======================================== */

.sparkle{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:rgba(255,255,255,.9);

  box-shadow:
    0 0 7px rgba(255,255,255,.9),
    0 0 16px rgba(134,231,255,.75);

  animation:sparkleFloat 3.5s ease-in-out infinite;
  pointer-events:none;
}

.sparkle::before,
.sparkle::after{
  content:"";
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  background:rgba(255,255,255,.75);
}

.sparkle::before{
  width:1px;
  height:18px;
}

.sparkle::after{
  width:18px;
  height:1px;
}

.s1{
  left:18%;
  top:25%;
  animation-delay:0s;
}

.s2{
  left:77%;
  top:22%;
  animation-delay:1.2s;
  transform:scale(.7);
}

.s3{
  left:27%;
  top:63%;
  animation-delay:2.1s;
  transform:scale(.55);
}

.s4{
  left:83%;
  top:57%;
  animation-delay:.7s;
  transform:scale(.8);
}

.s5{
  left:66%;
  top:72%;
  animation-delay:1.8s;
  transform:scale(.5);
}

.s6{
  left:11%;
  top:48%;
  animation-delay:2.7s;
  transform:scale(.65);
}

@keyframes sparkleFloat{
  0%,
  100%{
    opacity:.25;
    transform:scale(.65);
  }

  50%{
    opacity:1;
    transform:scale(1.15);
  }
}

/* ========================================
   시작 화면 텍스트
======================================== */

.startContent{
  position:relative;
  z-index:5;

  width:88%;
  text-align:center;

  display:flex;
  flex-direction:column;
  align-items:center;
}

.startEnglish{
  margin-bottom:14px;

  font-size:clamp(11px,2.7vw,15px);
  letter-spacing:.32em;
  font-weight:400;

  color:rgba(255,255,255,.78);

  text-shadow:
    0 0 12px rgba(120,225,255,.45);
}

.startTitle{
  font-size:clamp(34px,9vw,58px);
  font-weight:500;
  letter-spacing:.08em;

  color:#fff;

  text-shadow:
    0 0 12px rgba(255,255,255,.55),
    0 0 28px rgba(101,224,255,.4);

  margin-bottom:18px;
}

.startSubtitle{
  font-size:clamp(13px,3.5vw,18px);
  line-height:1.9;
  letter-spacing:.04em;

  color:rgba(255,255,255,.88);

  margin-bottom:42px;
}

/* 시작 버튼 */

.startButton{
  position:relative;

  width:min(220px,62vw);
  height:58px;

  border:1px solid rgba(255,255,255,.72);
  border-radius:40px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.16),
      rgba(255,255,255,.06)
    );

  color:#fff;

  font-size:15px;
  letter-spacing:.12em;

  cursor:pointer;

  backdrop-filter:blur(8px);

  box-shadow:
    0 0 20px rgba(116,225,255,.18),
    inset 0 0 20px rgba(255,255,255,.05);

  transition:
    transform .25s ease,
    background .25s ease,
    box-shadow .25s ease;
}

.startButton:hover{
  transform:translateY(-2px);

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.23),
      rgba(255,255,255,.09)
    );

  box-shadow:
    0 0 28px rgba(116,225,255,.32),
    inset 0 0 20px rgba(255,255,255,.08);
}

.startButton:active{
  transform:scale(.97);
}

/* ========================================
   게임 화면
======================================== */

.game{
  display:none;
  position:relative;

  width:100%;
  height:100%;

  aspect-ratio:9 / 16;

  overflow:hidden;

  background-image:
    linear-gradient(
      180deg,
      rgba(25,115,148,.10),
      rgba(2,18,43,.30)
    ),
    url("./bi.png");

  background-size:cover;
  background-position:center;

  isolation:isolate;
}

/* 화면 밝기 */

.game.stage1{
  filter:brightness(1);
}

.game.stage2{
  filter:brightness(1.055);
}

.game.stage3{
  filter:brightness(1.11);
}

/* 게임 위쪽 부드러운 빛 */

.game::before{
  content:"";
  position:absolute;
  inset:0;

  background:
    radial-gradient(
      ellipse at 50% 16%,
      rgba(255,255,255,.12),
      rgba(255,255,255,.035) 28%,
      transparent 58%
    );

  pointer-events:none;
  z-index:0;
}

/* 아래쪽 자연스러운 물빛 */

.game::after{
  content:"";
  position:absolute;
  left:-25%;
  bottom:-15%;

  width:150%;
  height:50%;

  background:
    radial-gradient(
      ellipse at center bottom,
      rgba(99,225,255,.20) 0%,
      rgba(60,174,215,.10) 34%,
      rgba(20,100,145,.035) 58%,
      transparent 78%
    );

  pointer-events:none;
  z-index:0;
}

/* ========================================
   단계 상단
======================================== */

.stageHeader{
  position:absolute;
  z-index:10;

  left:0;
  top:5.5%;

  width:100%;

  text-align:center;

  pointer-events:none;
}

.stageTitle{
  font-size:clamp(21px,5.5vw,34px);
  font-weight:400;

  letter-spacing:.13em;

  color:rgba(255,255,255,.95);

  text-shadow:
    0 0 12px rgba(255,255,255,.45);
}

.viewLabel{
  margin-top:11px;

  font-size:clamp(9px,2.4vw,13px);
  letter-spacing:.25em;

  color:rgba(255,255,255,.62);

  text-shadow:
    0 0 10px rgba(110,220,255,.35);
}

/* ========================================
   중앙 빛
======================================== */

.light{
  position:absolute;
  z-index:1;

  left:50%;
  top:22%;

  transform:translateX(-50%);

  width:86%;
  height:46%;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center 12%,
      rgba(255,255,255,.42) 0%,
      rgba(220,248,255,.27) 13%,
      rgba(145,225,248,.13) 29%,
      rgba(89,180,218,.065) 45%,
      rgba(30,100,145,.025) 60%,
      transparent 76%
    );

  filter:blur(1px);
}

/* ========================================
   물고기
======================================== */

.fish{
  position:absolute;
  z-index:5;

  width:25%;
  max-width:145px;

  cursor:pointer;

  user-select:none;
  -webkit-user-select:none;
  -webkit-tap-highlight-color:transparent;

  transition:
    transform .35s ease,
    filter .35s ease,
    opacity .35s ease;
}

.fish img{
  display:block;
  width:100%;
  height:auto;

  filter:
    drop-shadow(0 0 8px rgba(116,226,255,.24));
}

.fish:hover{
  transform:scale(1.07);
  filter:brightness(1.08);
}

/* 세 마리 위치 */

.f1,
.f4,
.f7{
  left:8%;
}

.f2,
.f5,
.f8{
  left:37.5%;
}

.f3,
.f6,
.f9{
  right:8%;
}

/* 1단계 */

.f1,
.f2,
.f3{
  top:40%;
}

/* 2단계 */

.f4,
.f5,
.f6{
  top:43%;
}

/* 3단계 */

.f7,
.f8,
.f9{
  top:46%;
}

/* ========================================
   맨 아래 안내 문구
======================================== */

.gameGuide{
  position:absolute;
  z-index:10;

  left:0;
  bottom:7.5%;

  width:100%;

  padding:0 22px;

  text-align:center;

  font-size:clamp(12px,3.2vw,16px);
  line-height:1.7;

  letter-spacing:.05em;

  color:rgba(255,255,255,.9);

  text-shadow:
    0 1px 5px rgba(0,20,40,.9),
    0 0 12px rgba(0,30,55,.75);

  pointer-events:none;
}

/* ========================================
   선택 메시지
======================================== */

.selectionMessage{
  position:absolute;
  z-index:20;

  left:50%;
  top:70%;

  width:88%;

  transform:
    translate(-50%, -50%)
    scale(.92);

  text-align:center;

  opacity:0;

  pointer-events:none;

  color:#fff;

  text-shadow:
    0 0 10px rgba(255,255,255,.7),
    0 0 24px rgba(103,223,255,.45);

  transition:
    opacity .35s ease,
    transform .35s ease;
}

.selectionMessage.show{
  opacity:1;

  transform:
    translate(-50%, -50%)
    scale(1);
}

.selectionMessage strong{
  display:block;

  font-size:clamp(18px,5vw,27px);
  font-weight:400;

  letter-spacing:.08em;
}

/* ========================================
   선택된 물고기
======================================== */

.fish.selected{
  transform:scale(1.16);

  filter:
    brightness(1.25)
    drop-shadow(0 0 18px rgba(180,245,255,.8));
}

.fish.dimmed{
  opacity:.28;
  filter:blur(1px);
}

/* ========================================
   작은 빛 알갱이
======================================== */

.particle{
  position:absolute;
  z-index:30;

  width:5px;
  height:5px;

  border-radius:50%;

  background:rgba(255,255,255,.95);

  box-shadow:
    0 0 8px rgba(255,255,255,.9),
    0 0 18px rgba(110,225,255,.8);

  pointer-events:none;

  animation:
    particleUp 1.2s ease-out forwards;
}

@keyframes particleUp{
  0%{
    opacity:0;
    transform:translate(0,0) scale(.4);
  }

  15%{
    opacity:1;
  }

  100%{
    opacity:0;
    transform:
      translate(
        var(--dx),
        var(--dy)
      )
      scale(0);
  }
}

/* ========================================
   마지막 기록 화면
======================================== */

.recordScreen{
  display:none;

  position:absolute;
  inset:0;

  z-index:50;

  background:
    linear-gradient(
      180deg,
      rgba(3,27,48,.78),
      rgba(2,17,34,.9)
    ),
    url("./bi.png");

  background-size:cover;
  background-position:center;

  overflow:auto;

  padding:8% 7%;
}

.recordInner{
  width:100%;
  min-height:100%;

  display:flex;
  flex-direction:column;
  align-items:center;
}

.recordTitle{
  margin-top:3%;

  color:#fff;

  font-size:clamp(24px,6vw,38px);
  font-weight:400;

  letter-spacing:.12em;

  text-align:center;
}

.recordText{
  margin-top:16px;
  margin-bottom:28px;

  color:rgba(255,255,255,.8);

  font-size:clamp(12px,3.3vw,16px);
  line-height:1.8;

  text-align:center;
}

.formWrap{
  width:100%;
  max-width:520px;

  background:rgba(255,255,255,.96);
  border-radius:18px;

  overflow:hidden;

  box-shadow:
    0 0 35px rgba(0,0,0,.3);
}

.formWrap iframe{
  display:block;

  width:100%;
  height:720px;

  border:0;
}

/* ========================================
   PC
======================================== */

@media (min-width:601px){

  .screen{
    border-radius:0;
  }

  .fish{
    width:22%;
  }

  .f1,
  .f4,
  .f7{
    left:10%;
  }

  .f3,
  .f6,
  .f9{
    right:10%;
  }
}

/* ========================================
   작은 휴대폰
======================================== */

@media (max-width:380px){

  .stageHeader{
    top:4.5%;
  }

  .stageTitle{
    font-size:21px;
  }

  .viewLabel{
    margin-top:8px;
    font-size:9px;
  }

  .fish{
    width:24%;
  }

  .f1,
  .f2,
  .f3{
    top:39%;
  }

  .f4,
  .f5,
  .f6{
    top:42%;
  }

  .f7,
  .f8,
  .f9{
    top:45%;
  }

  .gameGuide{
    bottom:6%;
    font-size:12px;
  }
}
</style>
</head>

<body>

<!-- ========================================
     첫 시작 화면
======================================== -->

<div class="screen startScreen" id="startScreen">

  <!-- 반짝이 -->
  <span class="sparkle s1"></span>
  <span class="sparkle s2"></span>
  <span class="sparkle s3"></span>
  <span class="sparkle s4"></span>
  <span class="sparkle s5"></span>
  <span class="sparkle s6"></span>

  <div class="startContent">

    <div class="startEnglish">
      TODAY'S POSSIBILITY
    </div>

    <div class="startTitle">
      오늘의 가능성
    </div>

    <div class="startSubtitle">
      지금, 당신의 시선이 머무는 곳에서<br>
      새로운 가능성을 만나보세요.
    </div>

    <button
      class="startButton"
      id="startButton"
      type="button">
      시작하기
    </button>

  </div>
</div>


<!-- ========================================
     게임 화면
======================================== -->

<div class="screen game stage1" id="game">

  <!-- 단계 상단 -->
  <div class="stageHeader">

    <div class="stageTitle" id="stageTitle">
      빛을 따라
    </div>

    <div class="viewLabel" id="viewLabel">
      YOUR FIRST GAZE
    </div>

  </div>


  <!-- 중앙 빛 -->
  <div class="light"></div>


  <!-- =====================================
       1단계
  ====================================== -->

  <div class="fish f1" data-word="용기">
    <img src="./f1.png" alt="용기">
  </div>

  <div class="fish f2" data-word="열정">
    <img src="./f2.png" alt="열정">
  </div>

  <div class="fish f3" data-word="호기심">
    <img src="./f3.png" alt="호기심">
  </div>


  <!-- =====================================
       2단계
  ====================================== -->

  <div class="fish f4" data-word="자신감" style="display:none;">
    <img src="./f4.png" alt="자신감">
  </div>

  <div class="fish f5" data-word="의지" style="display:none;">
    <img src="./f5.png" alt="의지">
  </div>

  <div class="fish f6" data-word="희망" style="display:none;">
    <img src="./f6.png" alt="희망">
  </div>


  <!-- =====================================
       3단계
  ====================================== -->

  <div class="fish f7" data-word="도전" style="display:none;">
    <img src="./f7.png" alt="도전">
  </div>

  <div class="fish f8" data-word="창의성" style="display:none;">
    <img src="./f8.png" alt="창의성">
  </div>

  <div class="fish f9" data-word="끈기" style="display:none;">
    <img src="./f9.png" alt="끈기">
  </div>


  <!-- 선택 결과 -->
  <div
    class="selectionMessage"
    id="selectionMessage">
  </div>


  <!-- 맨 아래 안내 -->
  <div
    class="gameGuide"
    id="gameGuide">
    세 마리 중 마음이 가는 한 마리를 선택해보세요
  </div>


  <!-- 마지막 기록 -->
  <div
    class="recordScreen"
    id="recordScreen">

    <div class="recordInner">

      <div class="recordTitle">
        오늘의 가능성
      </div>

      <div class="recordText">
        당신이 발견한 가능성을<br>
        자유롭게 남겨주세요.
      </div>

      <div class="formWrap">

        <iframe
          src="https://docs.google.com/forms/d/e/1FAIpQLSfTWl4MC_0N4e-LBbkA-uBKWS4O9g_SHO1hdDieHoE4IF6P2g/viewform?embedded=true"
          loading="lazy">
          로드 중…
        </iframe>

      </div>

    </div>

  </div>

</div>


<script>

/* ========================================
   기본 설정
======================================== */

const startScreen =
  document.getElementById("startScreen");

const startButton =
  document.getElementById("startButton");

const game =
  document.getElementById("game");

const stageTitle =
  document.getElementById("stageTitle");

const viewLabel =
  document.getElementById("viewLabel");

const gameGuide =
  document.getElementById("gameGuide");

const selectionMessage =
  document.getElementById("selectionMessage");

const recordScreen =
  document.getElementById("recordScreen");


let currentStage = 1;
let isSelecting = false;


/* ========================================
   시작하기
======================================== */

startButton.addEventListener("click", function(){

  startScreen.style.opacity = "0";
  startScreen.style.transform = "scale(1.03)";

  setTimeout(function(){

    startScreen.style.display = "none";

    game.style.display = "block";

  }, 700);

});


/* ========================================
   단계 정보
======================================== */

const stages = {

  1:{
    title:"빛을 따라",
    english:"YOUR FIRST GAZE",
    guide:"세 마리 중 마음이 가는 한 마리를 선택해보세요"
  },

  2:{
    title:"조금 더 가까이",
    english:"A LITTLE CLOSER",
    guide:"두 번째 시선이 머무는 한 마리를 선택해보세요"
  },

  3:{
    title:"수면을 향해",
    english:"TOWARD THE SURFACE",
    guide:"마지막으로 빛나는 한 마리를 선택해보세요"
  }

};


/* ========================================
   현재 단계 물고기
======================================== */

function getCurrentFish(){

  return game.querySelectorAll(
    '.fish[data-stage="' + currentStage + '"]'
  );

}


/* ========================================
   모든 물고기 가져오기
======================================== */

const fishList =
  document.querySelectorAll(".fish");


/* ========================================
   단계별 물고기 번호
======================================== */

const fishByStage = {

  1:[
    document.querySelector(".f1"),
    document.querySelector(".f2"),
    document.querySelector(".f3")
  ],

  2:[
    document.querySelector(".f4"),
    document.querySelector(".f5"),
    document.querySelector(".f6")
  ],

  3:[
    document.querySelector(".f7"),
    document.querySelector(".f8"),
    document.querySelector(".f9")
  ]

};


/* ========================================
   올바른 조사
======================================== */

const particleRo = [
  "용기",
  "의지",
  "끈기"
];

function getSelectionMessage(word){

  const particle =
    particleRo.includes(word)
      ? "를"
      : "을";

  return word + particle + " 선택했어요.";

}


/* ========================================
   반짝이는 파티클
======================================== */

function makeParticles(element){

  const rect =
    element.getBoundingClientRect();

  const gameRect =
    game.getBoundingClientRect();

  const centerX =
    rect.left - gameRect.left + rect.width / 2;

  const centerY =
    rect.top - gameRect.top + rect.height / 2;

  for(let i = 0; i < 14; i++){

    const particle =
      document.createElement("span");

    particle.className = "particle";

    particle.style.left =
      centerX + "px";

    particle.style.top =
      centerY + "px";

    const dx =
      (Math.random() - .5) * 150;

    const dy =
      -30 - Math.random() * 150;

    particle.style.setProperty(
      "--dx",
      dx + "px"
    );

    particle.style.setProperty(
      "--dy",
      dy + "px"
    );

    game.appendChild(particle);

    setTimeout(function(){
      particle.remove();
    }, 1300);

  }

}


/* ========================================
   단계 화면 변경
======================================== */

function setStage(stage){

  currentStage = stage;

  const info =
    stages[stage];

  stageTitle.textContent =
    info.title;

  viewLabel.textContent =
    info.english;

  gameGuide.textContent =
    info.guide;

  game.classList.remove(
    "stage1",
    "stage2",
    "stage3"
  );

  game.classList.add(
    "stage" + stage
  );


  /* 모든 물고기 숨기기 */

  fishList.forEach(function(fish){

    fish.style.display = "none";
    fish.classList.remove(
      "selected",
      "dimmed"
    );

  });


  /* 현재 단계 물고기만 보이기 */

  fishByStage[stage].forEach(function(fish){

    fish.style.display = "block";

  });

}


/* ========================================
   물고기 선택
======================================== */

fishList.forEach(function(fish){

  fish.addEventListener("click", function(){

    if(isSelecting){
      return;
    }

    isSelecting = true;


    const word =
      fish.dataset.word;


    /* 선택된 물고기 */

    fish.classList.add("selected");


    /* 나머지 물고기 흐리게 */

    fishByStage[currentStage].forEach(
      function(otherFish){

        if(otherFish !== fish){

          otherFish.classList.add("dimmed");

        }

      }
    );


    /* 반짝이 */

    makeParticles(fish);


    /* 선택 문구 */

    selectionMessage.innerHTML =
      "<strong>" +
      getSelectionMessage(word) +
      "</strong>";

    selectionMessage.classList.add("show");


    /* 단계가 넘어가기 전 잠시 보여주기 */

    setTimeout(function(){

      selectionMessage.classList.remove("show");

    }, 1200);


    /* 다음 단계 */

    setTimeout(function(){

      if(currentStage < 3){

        setStage(currentStage + 1);

        isSelecting = false;

      }else{

        /* 3단계가 끝나면 기록 화면 */

        setTimeout(function(){

          game.querySelectorAll(
            ".stageHeader, .light, .fish, .gameGuide, .selectionMessage"
          ).forEach(function(el){

            el.style.display = "none";

          });

          recordScreen.style.display =
            "block";

          isSelecting = false;

        }, 300);

      }

    }, 1450);

  });

});


/* ========================================
   시작 단계
======================================== */

setStage(1);

</script>
