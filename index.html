<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>오늘의 가능성</title>
<style>
:root{--ink:#26313d;--muted:#6e7b87;--line:rgba(38,49,61,.14)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#e8efee;color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif}
body{display:flex;justify-content:center;-webkit-tap-highlight-color:transparent}
.app{width:100%;min-height:100vh;background:linear-gradient(180deg,#dcecf0 0%,#d7e8ed 35%,#edf1ef 100%);overflow:hidden}
.top{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em}
.brand{font-family:Georgia,serif;font-size:15px}
.screen{width:min(720px,calc(100% - 28px));margin:22px auto}
.game{position:relative;aspect-ratio:1/1;overflow:hidden;background-image:linear-gradient(180deg,rgba(9,39,67,.04) 0%,rgba(8,42,72,.2) 48%,rgba(5,29,53,.62) 100%),url('https://images.unsplash.com/photo-1535591273668-578e31182c4f?auto=format&fit=crop&w=1400&q=85');background-size:cover;background-position:center;isolation:isolate;box-shadow:0 20px 60px rgba(54,61,72,.13);transition:background 1.2s ease,transform 1s ease}
.game:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(255,249,220,.7),transparent 35%),linear-gradient(115deg,rgba(25,93,132,.1),transparent 45%,rgba(3,27,55,.28));z-index:1;pointer-events:none}
.game:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-5%;height:30%;border-radius:50% 50% 0 0;background:linear-gradient(180deg,rgba(31,85,115,.05),rgba(7,35,62,.65));filter:blur(14px);animation:wave 5s ease-in-out infinite;z-index:2}
.title{position:absolute;top:7%;left:0;right:0;text-align:center;z-index:10}
.title h1{font:400 clamp(25px,6vw,40px) Georgia,serif;margin:0 0 8px;color:#f5fbff;text-shadow:0 2px 18px rgba(1,28,53,.45)}
.title p{font-size:11px;color:rgba(242,250,255,.9);margin:0;text-shadow:0 1px 8px rgba(0,22,43,.65)}
.progress{position:absolute;right:4%;top:3%;font-size:10px;color:rgba(242,250,255,.9);z-index:10;text-shadow:0 1px 8px rgba(0,22,43,.65)}
.view{position:absolute;inset:0;z-index:3;opacity:0;pointer-events:none;transition:opacity .7s ease,transform 1s ease}
.view.active{opacity:1;pointer-events:auto}
.view2,.view3{transform:translateY(55px)}
.view2.active,.view3.active{transform:translateY(0)}
.view1:not(.active),.view2:not(.active),.view3:not(.active){transform:translateY(-70px)}
.fish{position:absolute;width:112px;height:76px;border-radius:50%;background-size:cover;background-position:center;background-repeat:no-repeat;clip-path:ellipse(49% 46% at 50% 50%);cursor:pointer;z-index:6;filter:drop-shadow(0 9px 16px rgba(0,20,42,.35));animation:floatFish 5s ease-in-out infinite;overflow:visible;transition:transform .9s cubic-bezier(.2,.8,.2,1),opacity .5s,filter .5s}
.fish:before,.fish:after,.fish .fin,.fish .fin2{display:none}
.fish .spark{position:absolute;left:8px;top:10px;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:18px -8px 0 rgba(210,245,255,.8),-2px 23px 0 rgba(255,225,246,.7);animation:sparkle 2s ease-in-out infinite;z-index:4}
.f1,.f4,.f7{background-image:linear-gradient(rgba(255,177,218,.13),rgba(255,177,218,.13)),url('https://images.unsplash.com/photo-1524704654690-b56c05c78a00?auto=format&fit=crop&w=500&q=85');filter:hue-rotate(325deg) saturate(.8) drop-shadow(0 9px 16px rgba(0,20,42,.35))}
.f2,.f5,.f8{background-image:linear-gradient(rgba(167,221,255,.12),rgba(167,221,255,.12)),url('https://images.unsplash.com/photo-1518467166778-b88f373ffec7?auto=format&fit=crop&w=500&q=85');filter:hue-rotate(8deg) saturate(.75) drop-shadow(0 9px 16px rgba(0,20,42,.35))}
.f3,.f6,.f9{background-image:linear-gradient(rgba(255,220,164,.12),rgba(255,220,164,.12)),url('https://images.unsplash.com/photo-1535591273668-578e31182c4f?auto=format&fit=crop&w=500&q=85');filter:hue-rotate(18deg) saturate(.75) drop-shadow(0 9px 16px rgba(0,20,42,.35))}
.f1{left:16%;top:43%;animation:floatFish 4.2s ease-in-out infinite}
.f2{left:45%;top:35%;animation:floatFish 4.7s ease-in-out -1.2s infinite}
.f3{right:13%;top:50%;animation:floatFish 4.4s ease-in-out -2.3s infinite}
.f4{left:15%;top:52%;animation:floatFish 4.6s ease-in-out -.8s infinite}
.f5{left:44%;top:45%;animation:floatFish 4.1s ease-in-out -1.8s infinite}
.f6{right:13%;top:39%;animation:floatFish 4.9s ease-in-out -2.7s infinite}
.f7{left:17%;top:48%;animation:floatFish 4.5s ease-in-out -1.1s infinite}
.f8{left:45%;top:38%;animation:floatFish 4.3s ease-in-out -2.2s infinite}
.f9{right:14%;top:50%;animation:floatFish 4.8s ease-in-out -.5s infinite}
.fish:hover{transform:scale(1.1);filter:brightness(1.12) drop-shadow(0 0 24px rgba(201,245,255,.65))}
.fish.selected{animation:chooseFish 1.3s ease forwards}
.fish.gone{opacity:0;transform:scale(.45) translateY(-45px)}
.viewLabel{position:absolute;top:18%;left:0;right:0;text-align:center;font-size:10px;letter-spacing:.16em;color:rgba(242,250,255,.9);text-shadow:0 1px 8px rgba(0,22,43,.65)}
.light{position:absolute;left:20%;top:-12%;width:60%;height:92%;background:linear-gradient(180deg,rgba(255,250,220,.9),rgba(185,228,238,.25) 55%,transparent);clip-path:polygon(36% 0,64% 0,100% 100%,0 100%);filter:blur(15px);opacity:.8;mix-blend-mode:screen;animation:breathe 4s ease-in-out infinite;z-index:2}
.eyeView{position:absolute;left:50%;bottom:0;width:170px;height:105px;transform:translateX(-50%);z-index:8;pointer-events:none}
.eyeView:before{content:"";position:absolute;left:50%;bottom:-35px;width:220px;height:100px;transform:translateX(-50%);border-radius:50% 50% 0 0;background:radial-gradient(ellipse at center,rgba(44,71,85,.08),transparent 68%);filter:blur(7px)}
.eyeView:after{content:"";position:absolute;left:50%;bottom:-18px;width:85px;height:48px;transform:translateX(-50%);border-radius:50% 50% 45% 45%;background:linear-gradient(160deg,rgba(184,220,231,.4),rgba(103,157,184,.12));filter:blur(5px);clip-path:polygon(50% 0,85% 100%,15% 100%)}
.choiceGlow{position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,rgba(201,241,255,.55),rgba(178,218,255,.15),transparent 70%);filter:blur(4px);opacity:0;z-index:4;pointer-events:none}
.g1{left:4%;top:30%}.g2{left:42%;top:27%}.g3{right:2%;top:34%}
.game.stage2 .g1,.game.stage2 .g2,.game.stage2 .g3{opacity:.55;animation:glowPulse 2.2s ease-in-out infinite}
.game.stage3 .g1,.game.stage3 .g2,.game.stage3 .g3{opacity:.7;animation:glowPulse 1.8s ease-in-out infinite}
.message{position:absolute;bottom:5%;left:10%;right:10%;text-align:center;font-size:12px;line-height:1.7;z-index:12;transition:opacity .4s}
.message strong{display:block;font:400 18px Georgia,serif}
.btn{border:1px solid rgba(44,48,64,.2);background:rgba(250,250,248,.8);color:var(--ink);padding:11px 19px;border-radius:999px;font-size:12px;cursor:pointer}
.primary{background:#303746;color:white;border-color:#303746}
.center{display:flex;justify-content:center;margin-top:14px}
.special{display:none;min-height:calc(100vh - 62px);align-items:center;justify-content:center;padding:22px 16px}
.special.active{display:flex}
.card{width:min(620px,100%);text-align:center;background:rgba(250,250,248,.82);padding:46px 24px;box-shadow:0 20px 55px rgba(54,61,72,.09)}
.small{font-size:9px;letter-spacing:.22em;color:var(--muted);margin-bottom:22px}
.quote{font:400 clamp(22px,6vw,38px)/1.55 Georgia,serif;margin:0 auto 30px;max-width:520px}
.sub{font-size:12px;color:var(--muted);line-height:1.9;margin-bottom:24px}
.guest{display:none}.guest.active{display:block}
.guest iframe{width:100%;height:520px;border:0;background:white}
.notice{font-size:10px;color:var(--muted);margin-top:9px}
.back{margin-top:18px}
.rise .game{animation:surfaceRise 2.4s ease forwards}
.rise .view{animation:surfaceFade 1.5s ease forwards}
.rainbow{position:absolute;inset:-20%;z-index:30;pointer-events:none;opacity:0;background:conic-gradient(from 180deg,rgba(255,182,211,0),rgba(255,182,211,.58),rgba(255,235,166,.55),rgba(171,238,205,.5),rgba(170,215,255,.58),rgba(213,181,255,.52),rgba(255,182,211,0));filter:blur(18px);mix-blend-mode:screen}
.rise .rainbow{animation:rainbowRise 2.8s ease forwards}
.surface{position:absolute;left:-8%;right:-8%;top:78%;height:2px;background:rgba(255,255,255,.8);box-shadow:0 0 18px rgba(255,255,255,.75);z-index:25;opacity:0}
.rise .surface{animation:surfaceLine 2.1s ease forwards}
.sparkles{position:absolute;inset:0;z-index:28;pointer-events:none}
.sparkles i{position:absolute;width:4px;height:4px;border-radius:50%;background:white;box-shadow:0 0 12px white;opacity:0}
.rise .sparkles i{animation:riseSpark 2.2s ease forwards}
.s1{left:15%;bottom:15%}.s2{left:28%;bottom:28%;animation-delay:.15s}.s3{left:43%;bottom:18%;animation-delay:.3s}.s4{left:59%;bottom:25%;animation-delay:.45s}.s5{left:76%;bottom:16%;animation-delay:.6s}.s6{left:84%;bottom:36%;animation-delay:.75s}
.ripple{position:absolute;width:24px;height:24px;border:1px solid rgba(255,255,255,.8);border-radius:50%;pointer-events:none;z-index:15;animation:ripple .9s ease-out forwards}
.waveLine{position:absolute;left:-10%;right:-10%;height:18px;border-top:1px solid rgba(218,247,255,.7);box-shadow:0 -3px 18px rgba(173,231,245,.16);border-radius:50%;opacity:.35;animation:waveLine 4s ease-in-out infinite;z-index:5}
.w1{top:67%}.w2{top:74%;animation-delay:-1.5s}.w3{top:82%;animation-delay:-3s}
.rise .waveLine{animation-duration:1.5s;opacity:.75}
.card .possibilityWords{font:400 14px Georgia,serif;color:#687689;letter-spacing:.05em;margin-top:-12px;margin-bottom:22px}
@keyframes floatFish{0%,100%{transform:translate3d(0,0,0) rotate(0deg)}50%{transform:translate3d(10px,-13px,0) rotate(-3deg)}}
@keyframes chooseFish{0%{transform:scale(1)}35%{transform:scale(1.16) rotate(-5deg);filter:brightness(1.25) drop-shadow(0 0 22px rgba(255,255,255,.8))}100%{transform:translateY(-155px) scale(.72);opacity:0}}
@keyframes sparkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
@keyframes breathe{0%,100%{opacity:.45;transform:scaleX(.92)}50%{opacity:.88;transform:scaleX(1.06)}}
@keyframes wave{0%,100%{transform:translateX(-2%) rotate(-1deg)}50%{transform:translateX(2%) rotate(1deg)}}
@keyframes glowPulse{0%,100%{transform:scale(.8);opacity:.35}50%{transform:scale(1.12);opacity:.75}}
@keyframes ripple{to{width:150px;height:150px;opacity:0;transform:translate(-63px,-63px)}}
@keyframes surfaceRise{0%{filter:brightness(1)}45%{filter:brightness(1.35)}100%{filter:brightness(1.08)}}
@keyframes rainbowRise{0%{opacity:0;transform:scale(.6) rotate(-12deg)}35%{opacity:.8}100%{opacity:.95;transform:scale(1.18) rotate(8deg)}}
@keyframes surfaceLine{0%{top:95%;opacity:0;transform:scaleX(.5)}55%{opacity:1}100%{top:27%;opacity:.9;transform:scaleX(1.3)}}
@keyframes riseSpark{0%{opacity:0;transform:translateY(30px) scale(.4)}35%{opacity:1}100%{opacity:0;transform:translateY(-180px) scale(1.5)}}
@keyframes waveLine{0%,100%{transform:translateX(-2%) scaleX(1)}50%{transform:translateX(2%) scaleX(1.05)}}
@keyframes surfaceFade{0%{opacity:1}100%{opacity:0}}
@media(max-width:600px){
.top{height:56px;padding:0 15px}
.screen{width:calc(100% - 16px);margin:14px auto}
.special{min-height:calc(100vh - 56px);padding:14px 10px}
.card{padding:38px 18px}
.guest iframe{height:500px}
.fish{width:88px;height:62px}
.eyeView{transform:translateX(-50%) scale(.8);transform-origin:bottom center}
}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand">오늘의 가능성</div><div id="stageNo">01</div></header>

<section class="screen" id="gameScreen">
<div class="game" id="game">
<div class="title">
<h1 id="gameTitle">빛을 따라</h1>
<p id="gameGuide">세 마리 중 마음이 가는 한 마리를 선택해보세요</p>
</div>
<div class="progress" id="progress">1 / 3</div>
<div class="light"></div>
<div class="waveLine w1"></div><div class="waveLine w2"></div><div class="waveLine w3"></div>
<div class="choiceGlow g1"></div><div class="choiceGlow g2"></div><div class="choiceGlow g3"></div>

<div class="view view1 active">
<div class="viewLabel">YOUR FIRST GAZE</div>
<div class="fish f1" data-word="경험"><span class="fin"></span><span class="fin2"></span><span class="spark"></span></div>
<div class="fish f2" data-word="기억"><span class="fin"></span><span class="fin2"></span><span class="spark"></span></div>
<div class="fish f3" data-word="상상"><span class="fin"></span><span class="fin2"></span><span class="spark"></span></div>
</div>

<div class="view view2">
<div class="viewLabel">A LITTLE CLOSER</div>
<div class="fish f4" data-word="용기"><span class="fin"></span><span class="fin2"></span><span class="spark"></span></div>
<div class="fish f5" data-word="설렘"><span class="fin"></span><span class="fin2"></span><span class="spark"></span></div>
<div class="fish f6" data-word="발견"><span class="fin"></span><span class="fin2"></span><span class="spark"></span></div>
</div>

<div class="view view3">
<div class="viewLabel">TOWARD THE SURFACE</div>
<div class="fish f7" data-word="시작"><span class="fin"></span><span class="fin2"></span><span class="spark"></span></div>
<div class="fish f8" data-word="가능성"><span class="fin"></span><span class="fin2"></span><span class="spark"></span></div>
<div class="fish f9" data-word="빛"><span class="fin"></span><span class="fin2"></span><span class="spark"></span></div>
</div>

<div class="eyeView"></div>
<div class="rainbow"></div>
<div class="surface"></div>
<div class="sparkles"><i class="s1"></i><i class="s2"></i><i class="s3"></i><i class="s4"></i><i class="s5"></i><i class="s6"></i></div>
<div class="message" id="message"><strong>작은 빛을 찾아보세요.</strong>내 시선이 머무는 물고기를 눌러 시작하세요.</div>
</div>
<div class="center"><button class="btn" id="reset">다시 시작</button></div>
</section>

<section class="special" id="possibility">
<div class="card">
<div class="small">TODAY'S POSSIBILITY</div>
<p class="sub" id="chosenWords">당신이 발견한 가능성</p>
<p class="quote" id="quote"></p>
<button class="btn primary" id="write">나의 한마디 남기기</button>
<div class="guest" id="guest">
<iframe src="https://docs.google.com/forms/d/e/1FAIpQLSfTWl4MC_0N4e-LBbkA-uBKWS4O9g_SHO1hdDieHoE4IF6P2g/viewform?embedded=true" title="한마디 남기기"></iframe>
<div class="notice">남겨주신 한마디는 전시 기록으로 소중히 보관됩니다.</div>
<button class="btn back" id="again">다시 게임하기</button>
</div>
</div>
</section>

<script>
const allFish=[...document.querySelectorAll('.fish')],
game=document.getElementById('game'),
progress=document.getElementById('progress'),
message=document.getElementById('message'),
stageNo=document.getElementById('stageNo'),
gameTitle=document.getElementById('gameTitle'),
gameGuide=document.getElementById('gameGuide'),
views=[...document.querySelectorAll('.view')],
quotes=[
'당신 안의 작은 가능성들이 모여, 지금의 당신을 아름답게 빛냅니다.',
'당신은 이미 자신만의 색으로 충분히 빛나고 있습니다.',
'서로 다른 가능성을 품은 당신은 그 자체로 하나의 빛입니다.',
'당신 안에는 아직 발견되지 않은 빛이 가득합니다.',
'당신이 가진 가능성 하나하나가 모두 소중한 빛입니다.',
'당신은 수많은 가능성을 품고 있는 빛나는 사람입니다.',
'당신 안의 가능성들은 저마다 고유한 빛을 내고 있습니다.',
'당신이 가진 서로 다른 빛들이 모여 지금의 당신을 만듭니다.',
'당신은 이미 당신만의 가능성으로 반짝이고 있습니다.',
'당신 안에 있는 작은 가능성도 그 자체로 충분히 빛납니다.',
'당신의 용기와 열정은 이미 당신을 빛나게 하는 힘입니다.',
'당신은 스스로 알지 못하는 순간에도 자신만의 빛을 품고 있습니다.',
'당신 안의 수많은 가능성은 모두 당신을 이루는 아름다운 조각입니다.',
'당신이 가진 가능성은 다른 누구와도 다른 당신만의 빛입니다.',
'당신은 하나의 모습으로만 빛나는 사람이 아닙니다.',
'당신 안에는 서로 다른 색의 빛이 함께 살아가고 있습니다.',
'당신이 발견한 가능성마다 당신만의 빛이 담겨 있습니다.',
'당신은 이미 여러 가능성이 어우러진 하나의 아름다운 빛입니다.',
'당신의 작은 호기심조차 당신을 빛나게 하는 소중한 가능성입니다.',
'당신 안의 빛은 하나의 색으로 설명할 수 없을 만큼 다채롭습니다.',
'당신이 가진 가능성은 비교할 수 없는 당신만의 아름다움입니다.',
'당신은 지금 이 순간에도 무한한 가능성을 품고 있습니다.',
'당신 안의 모든 가능성은 저마다 빛날 가치가 있습니다.',
'당신은 스스로 생각하는 것보다 더 많은 빛을 품고 있습니다.',
'당신의 가능성은 서로 어우러져 지금 이 순간에도 반짝입니다.',
'당신은 이미 자신만의 색과 빛을 가진 소중한 존재입니다.',
'당신 안의 작은 빛들은 모자람 없이 저마다의 자리를 빛냅니다.',
'당신이 가진 가능성들은 모두 당신이라는 빛을 이루고 있습니다.',
'세 가지 가능성을 발견한 오늘, 당신 안의 다채로운 빛도 발견합니다.',
'당신 안의 모든 가능성이 모여, 오직 당신만이 만들어 낼 수 있는 빛이 됩니다.'
];
let stage=1,words=[],locked=false;

function makeRipple(f){
let ripple=document.createElement('span');
ripple.className='ripple';
ripple.style.left=(f.offsetLeft+f.offsetWidth/2-12)+'px';
ripple.style.top=(f.offsetTop+f.offsetHeight/2-12)+'px';
game.appendChild(ripple);
setTimeout(()=>ripple.remove(),900);
}

function setStage(n){
stage=n;
game.classList.remove('stage1','stage2','stage3');
game.classList.add('stage'+n);
views.forEach((v,i)=>v.classList.toggle('active',i===n-1));
progress.textContent=n+' / 3';
stageNo.textContent='0'+n;
if(n===1){
gameTitle.textContent='빛을 따라';
gameGuide.textContent='세 마리 중 마음이 가는 한 마리를 선택해보세요';
}
if(n===2){
gameTitle.textContent='조금 더 가까이';
gameGuide.textContent='두 번째 시선이 머무는 한 마리를 선택해보세요';
}
if(n===3){
gameTitle.textContent='수면을 향해';
gameGuide.textContent='마지막으로 빛나는 한 마리를 선택해보세요';
}
}

function finish(){
document.getElementById('gameScreen').style.display='none';
document.querySelector('.top').style.display='none';
document.getElementById('possibility').classList.add('active');

let special=words.join(' · ');
document.getElementById('chosenWords').innerHTML=
'<span class="possibilityWords">YOUR POSSIBILITY</span><br><strong>'+special+'</strong><br><br><span class="possibilityWords">당신의 가능성은 이미 당신 안에서 빛나고 있습니다.</span>';

document.getElementById('quote').textContent=quotes[Math.floor(Math.random()*quotes.length)];

let reminder=document.createElement('p');
reminder.className='sub';
reminder.id='possibilityReminder';
reminder.textContent='오늘 발견한 당신의 가능성을 기억해 주세요.';
document.getElementById('quote').insertAdjacentElement('afterend',reminder);

window.scrollTo(0,0);
}

allFish.forEach(f=>f.onclick=()=>{
if(locked||!f.closest('.view').classList.contains('active'))return;
locked=true;
f.classList.add('selected');
words.push(f.dataset.word);
makeRipple(f);
message.innerHTML='<strong>'+f.dataset.word+'을 선택했어요.</strong>'+(['빛이 천천히 가까워지고 있어요.','조금 더 위로 올라가 볼까요.','이제 수면 위의 빛이 기다리고 있어요.'][stage-1]);

setTimeout(()=>{
f.classList.add('gone');
if(stage<3){
setStage(stage+1);
locked=false;
message.innerHTML='<strong>새로운 가능성이 나타났어요.</strong>이번에는 어떤 빛에 마음이 머물까요?';
}else{
message.innerHTML='<strong>수면 위로 올라가요.</strong>빛이 당신을 감싸고 있어요.';
document.body.classList.add('rise');
setTimeout(finish,2500);
}
},900);
});

document.getElementById('reset').onclick=()=>location.reload();
document.getElementById('write').onclick=()=>{
document.getElementById('guest').classList.add('active');
document.getElementById('write').style.display='none';
};
document.getElementById('again').onclick=()=>location.reload();
</script>
</main>
</body>
</html>
